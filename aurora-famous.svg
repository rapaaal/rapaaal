
<svg xmlns="http://www.w3.org/2000/svg"
     width="450" height="172"
     viewBox="0 0 450 172"
     role="img"
     aria-label="Profile card NIN"
     font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">

  <title>Profile Card NIN</title>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5427c8"/>
      <stop offset="55%" stop-color="#7838a8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ec4899" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="avatarGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect width="450" height="172" rx="18"/>
    </clipPath>

    <clipPath id="avatarClip">
      <circle cx="54" cy="47" r="23"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#cardClip)">
    <rect width="450" height="172" fill="url(#background)"/>

    <ellipse cx="410" cy="0" rx="180" ry="120"
             fill="url(#glow)"/>

    <circle cx="430" cy="150" r="130"
            fill="#06b6d4" opacity=".08"/>

    <!-- Decorative circles -->
    <circle cx="405" cy="30" r="3" fill="#ffffff" opacity=".5"/>
    <circle cx="420" cy="42" r="2" fill="#ffffff" opacity=".3"/>
    <circle cx="390" cy="48" r="2" fill="#ffffff" opacity=".4"/>

    <!-- Main card -->
    <rect x="12" y="12" width="426" height="148"
          rx="14"
          fill="#ffffff" fill-opacity=".09"
          stroke="#ffffff" stroke-opacity=".2"/>

    <!-- Accent line -->
    <rect x="12" y="12" width="4" height="148"
          rx="2" fill="#c4b5fd"/>

    <!-- Header divider -->
    <path d="M28 86 H422"
          stroke="#ffffff" stroke-opacity=".15"/>

    <!-- Profile avatar -->
    <circle cx="54" cy="47" r="25"
            fill="#ffffff" fill-opacity=".2"/>

    <g clip-path="url(#avatarClip)">
      <circle cx="54" cy="47" r="23"
              fill="url(#avatarGradient)"/>

      <!-- Abstract profile logo -->
      <circle cx="54" cy="39" r="8"
              fill="#ffffff"/>

      <path d="M38 65
               C39 51 46 48 54 48
               C62 48 69 51 70 65 Z"
            fill="#ffffff"/>

      <circle cx="72" cy="32" r="13"
              fill="#c4b5fd" opacity=".3"/>
    </g>

    <!-- Name -->
    <text x="91" y="43"
          font-size="16"
          font-weight="700"
          fill="#ffffff">NIN</text>

    <!-- Verification badge -->
    <g transform="translate(133 38)">
      <circle r="9" fill="#1d9bf0"/>
      <path d="M-4 0 L-1 3 L4 -3"
            fill="none"
            stroke="#ffffff"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- Username -->
    <text x="91" y="62"
          font-size="13"
          fill="#ffffff"
          fill-opacity=".7">@rapaaal_</text>

    <!-- Small profile decoration -->
    <circle cx="412" cy="47" r="15"
            fill="#ffffff" fill-opacity=".08"/>

    <path d="M406 47 L412 41 L418 47 L412 53 Z"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".6"
          stroke-width="1.5"/>

    <!-- Description -->
    <text x="28" y="111"
          font-size="16"
          font-weight="600"
          fill="#ffffff">
      Robotics &amp; Artificial Intelligence
    </text>

    <text x="28" y="130"
          font-size="12"
          fill="#ffffff"
          fill-opacity=".65">
      Enthusiast | Applied Innovation Research
    </text>

    <!-- Statistics -->
    <text x="28" y="149"
          font-size="12"
          fill="#ffffff"
          fill-opacity=".8">💬 18.1K</text>

    <text x="109" y="149"
          font-size="12"
          fill="#ffffff"
          fill-opacity=".8">♡ 309.3K</text>

    <!-- Decorative bottom accent -->
    <rect x="365" y="143" width="45" height="3"
          rx="1.5" fill="#c4b5fd" opacity=".7"/>
  </g>
</svg>
