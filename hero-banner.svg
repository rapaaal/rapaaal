<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060f">
        <animate attributeName="stop-color" values="#05060f;#170b30;#05060f" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#1b1035">
        <animate attributeName="stop-color" values="#1b1035;#2e1065;#1b1035" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#05060f">
        <animate attributeName="stop-color" values="#05060f;#0b2233;#05060f" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      <animate attributeName="x1" values="-40%;140%" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;180%" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="260" rx="26" fill="url(#bg)"/>

  <!-- floating glow particles -->
  <circle cx="90" cy="60" r="30" fill="url(#glowCyan)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="70" r="36" fill="url(#glowViolet)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,16;0,0" dur="6.5s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="6.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="150" cy="205" r="22" fill="url(#glowPink)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4.2s" repeatCount="indefinite" begin="1.1s"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.2s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <circle cx="1080" cy="200" r="26" fill="url(#glowCyan)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="5.6s" repeatCount="indefinite" begin="1.8s"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5.6s" repeatCount="indefinite" begin="1.8s"/>
  </circle>
  <circle cx="600" cy="30" r="18" fill="url(#glowViolet)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="4.8s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="4.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>

  <!-- circuit traces -->
  <path d="M40,44 L210,44 L210,96 L360,96" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.6"/>
  <circle r="4.5" fill="url(#glowCyan)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M40,44 L210,44 L210,96 L360,96"/>
  </circle>

  <path d="M1160,216 L990,216 L990,164 L840,164" fill="none" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1.6"/>
  <circle r="4.5" fill="url(#glowViolet)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M1160,216 L990,216 L990,164 L840,164"/>
  </circle>

  <!-- name: glow layer + crisp layer -->
  <text x="600" y="140" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700"
        text-anchor="middle" fill="#22d3ee" filter="url(#blur6)">
    RAFA ALBANIN FUAD
    <animate attributeName="opacity" values="0.45;0.75;0.45" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="140" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700"
        text-anchor="middle" fill="#f8fafc">
    RAFA ALBANIN FUAD
  </text>

  <!-- subtitle -->
  <text x="600" y="180" font-family="Consolas, Menlo, monospace" font-size="16" letter-spacing="3"
        text-anchor="middle" fill="#94a3b8">
    ROBOTICS ENGINEERING &amp; ARTIFICIAL INTELLIGENCE
  </text>

  <!-- shimmering underline -->
  <rect x="430" y="198" width="340" height="2.4" fill="url(#shimmer)"/>
</svg>
